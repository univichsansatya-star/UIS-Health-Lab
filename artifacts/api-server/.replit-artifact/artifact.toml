kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "uv run python manage.py runserver 0.0.0.0:$PORT"

[services.production]

[services.production.build]
args = ["uv", "sync", "--locked"]

[services.production.run]
args = ["uv", "run", "gunicorn", "--chdir", "artifacts/api-server", "config.wsgi:application", "--bind", "0.0.0.0:8080"]

[services.production.run.env]
PORT = "8080"
DJANGO_DEBUG = "false"

[services.production.health.startup]
path = "/api/healthz"
